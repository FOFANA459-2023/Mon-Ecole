# Quality and security gate for every pull request.
# CD runs this same file before publishing main.
#
#   quality   eslint, TypeScript, unit + component tests (Vitest, Testing Library, MSW) with a coverage floor,
#             production build, API types compared with the backend schema
#   sast      semgrep (JavaScript, TypeScript, React, secrets, Dockerfile, nginx rules)
#   deps      npm audit (known vulnerabilities; high/critical in shipped code blocks the merge)
#   secrets   gitleaks (whole git history)
#   image     hadolint, build, smoke test, non-root check, trivy (image + configuration)
#   headers   OWASP ZAP baseline scan of the served app (security headers, cookies, CSP)
#   e2e       Playwright end-to-end + accessibility (axe) against the real API from Mon-Ecole-Backend
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read access to Mon-Ecole-Backend (private) to compare the API types with its schema.
      BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch the backend API schema
        if: env.BACKEND_REPO_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: FOFANA459-2023/Mon-Ecole-Backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: .backend-schema
          sparse-checkout: openapi.yaml
          sparse-checkout-cone-mode: false
      - name: API types match the backend schema
        if: env.BACKEND_REPO_TOKEN != ''
        run: OPENAPI_SCHEMA=.backend-schema/openapi.yaml npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - name: API types check skipped
        if: env.BACKEND_REPO_TOKEN == ''
        run: echo "::notice::Add a BACKEND_REPO_TOKEN secret (read access to Mon-Ecole-Backend) to check the API types against the backend schema."
      - run: npx eslint . --max-warnings=0
      - run: npm run typecheck
      - name: Unit and component tests (coverage floor)
        run: npm run test:coverage
      - run: npm run build
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          semgrep scan --metrics off --error
          --config p/javascript --config p/typescript --config p/react --config p/secrets
          --config p/dockerfile --config p/nginx
          --exclude src/lib/api/schema.d.ts

  deps:
    name: Dependency vulnerabilities (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Shipped dependencies (high and critical block the merge)
        run: npm audit --omit=dev --audit-level=high
      - name: Build and test tooling (critical blocks the merge)
        run: npm audit --audit-level=critical

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the whole history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --no-banner

  image:
    name: Docker image (lint, build, scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        run: docker run --rm -v "$PWD:/w" -w /w hadolint/hadolint:latest-debian hadolint Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mon-ecole-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name web -p 8080:8080 -e API_UPSTREAM=http://127.0.0.1:9 mon-ecole-frontend:ci
          for _ in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/students/42 | grep -q '<div id="root">'
          curl -fsI http://localhost:8080/ | grep -qi '^content-security-policy:'
          test "$(docker exec web id -u)" != "0"
          docker rm -f web
      - name: Trivy (image vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mon-ecole-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy (Dockerfile and compose misconfiguration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  headers:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mon-ecole-frontend:ci
          cache-from: type=gha
      - name: Serve the app
        run: docker run -d --name web -p 8080:8080 -e API_UPSTREAM=http://127.0.0.1:9 mon-ecole-frontend:ci
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv -I -r zap-report.html -J zap-report.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap/zap-report.*
          retention-days: 14

  e2e:
    name: End-to-end and accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
      E2E_PASSWORD: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_BASE_URL: http://localhost:8080
    steps:
      - name: E2E skipped
        if: env.BACKEND_REPO_TOKEN == ''
        run: echo "::notice::Add a BACKEND_REPO_TOKEN secret (read access to Mon-Ecole-Backend) to run the end-to-end tests."
      - uses: actions/checkout@v7
        if: env.BACKEND_REPO_TOKEN != ''
      - name: Check out the API
        if: env.BACKEND_REPO_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: FOFANA459-2023/Mon-Ecole-Backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: .backend
      - name: Start the API with demo data
        if: env.BACKEND_REPO_TOKEN != ''
        working-directory: .backend
        env:
          THROTTLE_LOGIN: 1000/min # the suite signs in many times a minute
        run: |
          docker compose up -d --build --wait db valkey backend
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py seed_demo --password "$E2E_PASSWORD"
      - name: Serve the app (production image)
        if: env.BACKEND_REPO_TOKEN != ''
        run: docker compose --profile prod up -d --build --wait web
      - uses: actions/setup-node@v7
        if: env.BACKEND_REPO_TOKEN != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: env.BACKEND_REPO_TOKEN != ''
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright
        if: env.BACKEND_REPO_TOKEN != ''
        run: npx playwright test
      - if: failure() && env.BACKEND_REPO_TOKEN != ''
        working-directory: .backend
        run: docker compose logs backend | tail -200
      - if: always() && env.BACKEND_REPO_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
