# Build the SPA for one environment and upload it to Cloudflare Pages (Direct Upload project).
# Called by CI (pull-request previews) and CD (staging, production).
#
# Repository settings (Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN      token with the "Cloudflare Pages: Edit" permission
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable CLOUDFLARE_PAGES_PROJECT  e.g. mon-ecole (production branch: main)
# Per environment (Settings → Environments → preview / staging / production → Variables):
#   variable VITE_API_URL              e.g. https://api.staging.example.org/api/v1
name: Deploy to Cloudflare Pages

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      branch:
        description: Pages branch; the project's production branch (main) is the live site
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Pages (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: pages-${{ inputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ inputs.branch }}
            --commit-hash=${{ github.sha }}
      - name: Summary
        run: echo "Deployed ${{ inputs.environment }} to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
