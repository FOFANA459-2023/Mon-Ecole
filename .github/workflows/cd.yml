# Delivery pipeline:
#   push to main  → CI → multi-arch nginx image on GHCR → Cloudflare Pages "staging" branch (when DEPLOY_STAGING = true)
#   tag v1.2.3    → CI → multi-arch nginx image on GHCR → Cloudflare Pages production     (when DEPLOY_PRODUCTION = true;
#                                                          add required reviewers to the "production" environment)
# Settings are listed at the top of pages.yml; see README "Deployment".
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/fofana459-2023/mon-ecole-frontend

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  image:
    name: Build and publish image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with Sigstore
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply chain: a software bill of materials and build provenance travel with the image.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4
      - name: Sign the image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  staging:
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      environment: staging
      branch: staging
    secrets: inherit

  production:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_PRODUCTION == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      environment: production
      branch: main
    secrets: inherit
