# Delivery pipeline: push to main or a v* tag → CI → multi-arch nginx image on GHCR,
# and every push to main → CI → the site on the Cloudflare Worker `mon-ecole` (wrangler.jsonc).
#
# Settings → Environments → production:
#   secret   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   variable CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Account ID
#   variable VITE_API_URL           e.g. https://api.example.org/api/v1 (baked in at build time)
# Settings → Secrets and variables → Actions → Variables: DEPLOY_WORKER = true switches the deploy on.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/fofana459-2023/mon-ecole-frontend
  NODE_VERSION: "22"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  image:
    name: Build and publish image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with Sigstore
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply chain: a software bill of materials and build provenance travel with the image.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  site:
    name: Deploy the site (Cloudflare Worker)
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_WORKER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://mon-ecole.fvarlee.workers.dev
    concurrency:
      group: worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          test -n "$VITE_API_URL" || { echo "::error::Set VITE_API_URL in the production environment."; exit 1; }
          npm run build
      - name: Check the Cloudflare token
        # A token pasted with a line break or extra text fails deep inside wrangler ("invalid header
        # value"); say plainly what is wrong instead. Surrounding spaces and newlines are tolerated.
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          lines="$(printf '%s' "$RAW_TOKEN" | grep -c '[^[:space:]]' || true)"
          token="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if [ "$lines" != "1" ] || ! printf '%s' "$token" | grep -Eq '^[A-Za-z0-9_-]{30,}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN must be the token alone, on one line. Re-save the production secret with only the token Cloudflare showed."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy (wrangler)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --message "$GITHUB_SHA"
